<VirtualHost *:80>
    ServerName astrotarot.hu
    ServerAlias www.astrotarot.hu astrotarot.cloud www.astrotarot.cloud

    DocumentRoot /var/www/tarot/public

    <Directory /var/www/tarot/public>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/tarot_error.log
    CustomLog ${APACHE_LOG_DIR}/tarot_access.log combined
</VirtualHost>

